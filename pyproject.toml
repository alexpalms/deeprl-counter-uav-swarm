[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-cuas"
version = "0.1.0"
keywords = ["reinforcement-learning", "decision-support-systems", "intelligent-control", "drone-swarm-defense", "simulation-based-evaluation", "critical-infrastructure-protection"]
maintainers = [
  { name="Alessandro Palmas", email="alex@artificialtwin.com" },
]
authors = [
  { name="Alessandro Palmas", email="alex@artificialtwin.com" },
]
description = "Reinforcement Learning for Decision-Level Interception Prioritization in Drone Swarm Defense"
readme = { file = "README.md", content-type = "text/markdown"}
license = { file = "LICENSE" }

requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "gymnasium>=1.2.0",
    "matplotlib>=3.10.6",
    "pandas>=2.3.2",
    "pyyaml>=6.0.2",
    "sb3-contrib>=2.7.0",
    "scipy>=1.16.2",
    "stable-baselines3>=2.7.0",
    "tensorboard>=2.20.0",
]

# Added with `uv add --group dev package_name`
[dependency-groups]
dev = [
    "pandas-stubs>=2.3.2.250827",
    "pre-commit>=4.3.0",
    "pyright>=1.1.405",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.12.12",
    "twine>=6.2.0",
    "types-pyyaml>=6.0.12.20250915",
]
docs = [
    "furo>=2025.7.19",
    "myst-parser>=4.0.1",
    "sphinx>=8.2.3",
    "sphinx-autobuild>=2025.8.25",
    "sphinx-autodoc-typehints>=3.2.0",
]

[project.urls]
Homepage = "https://github.com/alexpalms/deeprl-counter-uav-swarm/"
Issues = "https://github.com/alexpalms/deeprl-counter-uav-swarm/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rl_cuas = ["py.typed", "data/*"]

[project.scripts]
rl-cuas-cli = "rl_cuas.cli:main"

[tool.pyright]
include = ["src", "examples", "tests", "docs"]
typeCheckingMode = "strict"
reportUnusedVariable = "error"
reportMissingImports = "error"
reportMissingParameterType = "error"
reportMissingTypeArgument = "error"
reportUntypedFunctionDecorator = "error"
reportMissingTypeStubs = "error"
extraPaths = ["stubs"]
exclude = []

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = []

[tool.ruff.lint]
select = [
  "E", "F", "UP", "I", "B", "N", "S", "A", "C4", "T20"
]
ignore = ["E501", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"src/**/__init__.py" = ["D104", "D107"]  # ignore module and __init__ docstrings
"tests/**" = ["S101"]  # allow asserts in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
